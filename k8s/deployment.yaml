apiVersion: apps/v1
kind: Deployment
metadata:
  name: spec2code
  labels:
    app: spec2code
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spec2code
  template:
    metadata:
      labels:
        app: spec2code
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: spec2code
          image: ghcr.io/nagendraanalytics/spec2code:v4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: spec2code-secrets
                  key: anthropic-api-key
            - name: DATABASE_URL
              value: "sqlite:////app/data/cdm_spec_to_cql.db"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8002
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /api/health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: spec2code-data
