apiVersion: v1
kind: PersistentVolume
metadata:
  name: spec2code-data-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: /mnt/data/spec2code
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spec2code-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 10Gi
