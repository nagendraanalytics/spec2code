name: ci-cd

on:
  push:
    branches: [main]
    paths-ignore: ["k8s/**"] # Don't run if only the k8s manifest changes
  workflow_dispatch:        # Allows manual trigger from GitHub UI

permissions:
  contents: write        # To push the manifest update
  packages: write        # To push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Kubernetes manifest
        run: |
          # Get the short SHA tag generated by the metadata action
          NEW_TAG="sha-${GITHUB_SHA::7}"
          
          # Replace whatever tag is currently there with the new SHA
          sed -i "s|image: ghcr.io/nagendraanalytics/spec2code:.*|image: ghcr.io/nagendraanalytics/spec2code:${NEW_TAG}|g" k8s/deployment.yaml
          
          # Commit and push only if there are changes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --cached --quiet || git commit -m "deploy: update spec2code to ${NEW_TAG} [skip ci]"
          git push origin main
